[workspace]
resolver = "3"
members = ["crates/core", "crates/jellysink", "crates/jellytui"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Stax124/jellysink"
rust-version = "1.88"

# Lint policy lives here, not only as a CI flag, so `cargo clippy` locally
# matches `cargo clippy --all-targets -- -D warnings` in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
color-eyre = "0.6"
dialoguer = { version = "0.12.0", default-features = false, features = [
    "password",
] }
directories = "6"
futures-util = { version = "0.3", features = ["sink"] }
ico = "0.5"
# JPEG stays alongside WebP: `format=Webp` is a request, and the server hands
# back the original untouched when it cannot re-encode it.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
ksni = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "std",
] }
# Defaults are wrong here twice over: `chafa-dyn` links libchafa through
# pkg-config, which the all-musl build has no C library for, and
# `image-defaults` pulls in every decoder when WebP and JPEG answer for
# everything the server can send.
ratatui-image = { version = "11", default-features = false, features = [
    "crossterm",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
rustix = { version = "1", features = ["fs", "process", "system"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
self_update = { version = "1.1", default-features = false, features = [
    "github",
    "reqwest",
    "rustls",
    "async",
    "checksums",
    "progress-bar",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tikv-jemallocator = "0.7"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
toml = "1"
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "std",
    "smallvec",
    "tracing-log",
] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

jellysink-core = { path = "crates/core" }

# `ratatui-image` sends the kitty transmit as raw RGBA, and it is written to
# the terminal from inside `draw`, so a cover costs the frame that first shows
# it. This fork deflates it (`o=z`), which halves that. Pinned to a rev rather
# than a branch so a build is reproducible; drop the patch if it lands upstream.
[patch.crates-io]
ratatui-image = { git = "https://github.com/Stax124/ratatui-image", rev = "988d3b9e11aa279cc4b038fa8d53b0a6711f8a6d" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
