name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Callable as a required pipeline: `.github/workflows/release.yml` gates the
  # release on this exact workflow instead of keeping a second copy of it.
  workflow_call:
    inputs:
      package:
        description: Package the built binaries and upload them as artifacts.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: check formatting
        run: cargo fmt -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools, mpv and dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mpv dbus
          mpv --version | head -1
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      # `dbus-run-session` gives the MPRIS smoke test a private session bus
      # that is torn down with the step; runners have no user session bus.
      - name: test
        run: dbus-run-session -- cargo test --locked

  # The musl release build itself: on pull requests and pushes a failing binary
  # build is visible before tagging, and the release workflow calls this same job
  # with `package: true` to produce the artifacts it publishes.
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            cargo: cargo
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
            cargo: cross
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cargo == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: ${{ matrix.cargo }} build --locked --release --target ${{ matrix.target }}
      # `inputs` is null outside `workflow_call`, so PR and push runs skip these.
      - name: Package
        if: inputs.package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv jellysink ../../../jellysink-${{ matrix.target }}
          cd -
      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: jellysink-${{ matrix.target }}
          path: jellysink-${{ matrix.target }}
          if-no-files-found: error
