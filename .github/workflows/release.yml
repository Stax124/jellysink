name: Release

on:
  push:
    tags:
      # X.Y.Z (no leading v). GitHub tag filters are globs, not regex.
      - "[0-9]*.[0-9]*.[0-9]*"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Ensure Tag Matches Cargo.toml
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check Cargo Version Matches Tag
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="${GITHUB_REF_NAME}"
          echo "Cargo.toml version: ${cargo_version}"
          echo "Git tag: ${tag}"
          if [ "${tag}" != "${cargo_version}" ]; then
            echo "Tag ${tag} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

  # A tag must not publish a release from a commit that would fail CI, so the
  # release is gated on the CI workflow itself rather than a second copy of it.
  # `package: true` makes its build matrix upload the binaries published below.
  ci:
    name: ci
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  release:
    name: release
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          for f in jellysink-*; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
          done
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
